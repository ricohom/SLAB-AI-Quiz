<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz-Master</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
</head>
<body>
  <div id="particles-js"></div>

  <button id="btnLogout" class="btn-logout-fixed hidden">Logout</button>

  <div class="container" id="app"></div>

  <!-- Login-/Signup-Dialog -->
  <dialog id="authDialog">
    <h3 id="authTitle">Login</h3>

    <input id="authUser" placeholder="Benutzername" autocomplete="off">
    <input id="authPass" type="password" placeholder="Passwort">

    <p id="authError" class="error"></p>

    <button id="authOK"  class="btn primary">OK</button>
    <button id="authSwap" class="btn">
      oder <span id="swapText">Registrieren</span>
    </button>
  </dialog>

  <!-- Kern-JS -->
  <script type="module" src="src/main.js"></script>
</body>
</html>

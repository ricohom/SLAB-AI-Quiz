<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TV‑Quizshow</title>

  <!-- Animation / Deko (optional) -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="particles-js"></div>

  <div class="container">
    <header class="header">
      <h1 class="gradient-text">Willkommen zur TV‑Quizshow</h1>
      <p class="slogan">Teste dein Wissen live &amp; interaktiv — nur mit deiner Stimme!</p>
    </header>

    <main class="main-content">
      <section class="moderator">
        <img src="assets/mod.png" alt="Moderator" class="moderator-img">
      </section>

      <section class="quiz-content">
        <div class="question"><h2 id="question-text">Klicke auf „Spiel starten“</h2></div>

        <div class="answers" id="answer-buttons"></div>

        <div class="feedback"><p id="feedback-text">… hier erscheint dein Ergebnis …</p></div>

        <div class="controls">
          <button id="btn-start" class="primary-btn">🎬 Spiel starten</button>
          <button id="btn-stt" class="secondary-btn hidden">🎙️ Antwort sprechen</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2025 TV‑Quizshow • Hochschulprojekt</p>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
